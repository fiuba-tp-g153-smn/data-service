# Data-services stack (`make data`): the two app roles only, no Redis.
#
# Split out from the all-in-one docker-compose.yaml (`make prod`) so the app
# tier runs on its own lifecycle, with Redis brought up separately via
# `make redis` (docker-compose.redis.yaml).
#
# Reaches Redis over the shared external `data_service_network` as `redis:6379`
# (REDIS_URL=redis://redis:6379/0). There is intentionally NO `depends_on: redis`
# here: the two stacks are independent compose projects, the Redis client connects
# lazily, and the restart policy + healthcheck cover a cold Redis. When Redis moves
# to a separate host, only REDIS_URL changes (point it at the Redis host).
#
# Run with its own project name so it's independent of the `redis` stack:
#   docker compose -p data-service-data -f docker-compose.data.yaml up --build
# Requires the shared network once:  docker network create data_service_network

# Shared environment for both roles. WEB_CONCURRENCY + APP_ROLE are set per role.
x-ds-env: &ds-env
  LOG_LEVEL: ${LOG_LEVEL}
  APP_ENV: ${APP_ENV}
  # S3 Configuration - connect to external S3 (e.g., S3 from tiles-processor)
  S3_TILES_DATA_ENDPOINT: ${S3_TILES_DATA_ENDPOINT}
  S3_TILES_DATA_ACCESS_KEY: ${S3_TILES_DATA_ACCESS_KEY}
  S3_TILES_DATA_SECRET_KEY: ${S3_TILES_DATA_SECRET_KEY}
  S3_TILES_DATA_BUCKET_NAME: ${S3_TILES_DATA_BUCKET_NAME}
  S3_TILES_DATA_SECURE: ${S3_TILES_DATA_SECURE}
  SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS}
  REDIS_URL: ${REDIS_URL}
  # Basemap tile backup bucket + per-provider source URLs
  S3_BASEMAP_BUCKET_NAME: ${S3_BASEMAP_BUCKET_NAME}
  BASEMAP_ARGENMAP_URL: ${BASEMAP_ARGENMAP_URL}
  BASEMAP_ARGENMAPGRIS_URL: ${BASEMAP_ARGENMAPGRIS_URL}
  BASEMAP_ARGENMAPOSCURO_URL: ${BASEMAP_ARGENMAPOSCURO_URL}
  BASEMAP_ARGENMAPTOPOGRAFICO_URL: ${BASEMAP_ARGENMAPTOPOGRAFICO_URL}
  BASEMAP_SATELLITE_URL: ${BASEMAP_SATELLITE_URL}
  BASEMAP_TOPOGRAPHIC_URL: ${BASEMAP_TOPOGRAPHIC_URL}
  BASEMAP_GOOGLESATELLITE_URL: ${BASEMAP_GOOGLESATELLITE_URL}
  BASEMAP_OCEANBASE_URL: ${BASEMAP_OCEANBASE_URL}
  # Weather stations: dedicated S3 bucket + SMN API credentials + admin password
  S3_WEATHER_STATIONS_BUCKET_NAME: ${S3_WEATHER_STATIONS_BUCKET_NAME}
  SMN_API_BASE_URL: ${SMN_API_BASE_URL}
  SMN_API_USERNAME: ${SMN_API_USERNAME}
  SMN_API_PASSWORD: ${SMN_API_PASSWORD}
  SMN_API_TOKEN_SETTLING_DELAY_SECONDS: ${SMN_API_TOKEN_SETTLING_DELAY_SECONDS}
  SMN_API_USER_AGENT: ${SMN_API_USER_AGENT}
  SMN_API_LOG_REQUESTS: ${SMN_API_LOG_REQUESTS}
  SMN_STATIONS_REGISTRY_URL: ${SMN_STATIONS_REGISTRY_URL}
  WEATHER_STATIONS_ADMIN_PASSWORD: ${WEATHER_STATIONS_ADMIN_PASSWORD}

# Shared service config for both roles (same image, build, deps, health, volume).
# No `depends_on: redis` — Redis lives in docker-compose.redis.yaml (separate project).
x-ds-common: &ds-common
  image: data-service
  build:
    context: .
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"  # Allows connecting to host services (Linux)
  volumes:
    - dataservice_data:/app/data
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
    interval: 10s
    timeout: 10s
    retries: 5
    start_period: 15s
    start_interval: 1s
  networks:
    - data_service_network

services:
  # Web role: serves HTTP only (no background sync), so request latency is never
  # starved by sync CPU.
  data-service-api:
    <<: *ds-common
    container_name: data-service-api
    ports:
      - "${APP_HOST_PORT}:8080"
    environment:
      <<: *ds-env
      APP_ROLE: web
      WEB_CONCURRENCY: ${WEB_CONCURRENCY}

  # Worker role: runs all background jobs (tile sync + basemap/weather scrapers +
  # Redis-metrics collector). No public port. Raise WORKER_CONCURRENCY to spread
  # the loops across more cores if it falls behind.
  data-service-sync:
    <<: *ds-common
    container_name: data-service-sync
    environment:
      <<: *ds-env
      APP_ROLE: worker
      WEB_CONCURRENCY: ${WORKER_CONCURRENCY:-1}

volumes:
  dataservice_data:

networks:
  data_service_network:
    external: true
