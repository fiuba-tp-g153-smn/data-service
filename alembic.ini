# Alembic configuration for the data-service metrics SQLite store.
#
# The metrics database is a single INDEPENDENT named section with its own
# history, env and alembic_version table. The sqlalchemy.url is left blank here
# and injected at runtime by src/db/migrate.py, because the database path is
# dynamic (settings.metrics_db_path).
#
# Invoked programmatically (command.upgrade with config_ini_section set), or via
# the CLI to author revisions: `alembic -c alembic.ini -n metrics revision -m "..."`.

[metrics]
script_location = %(here)s/migrations/metrics
sqlalchemy.url =
