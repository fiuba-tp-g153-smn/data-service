# Redis-only stack (`make redis`).
#
# Split out from the all-in-one docker-compose.yaml (`make prod`) so the cache
# can run on its own lifecycle — and, later, its own host — isolated from the
# data-service + the co-located GDAL renderer / SeaweedFS that were paging it
# to swap.
#
# REDIS_PASSWORD is required (redis-server --requirepass); set it in a .env next
# to this file. The data services get the same REDIS_PASSWORD as their own env
# var, never inside REDIS_URL.
#
# Same host: joins the shared external `data_service_network`, so co-located
# data services reach it as `redis:6379` via DNS (REDIS_URL=redis://redis:6379/0).
#
# Cross host: port 6379 is published to the host (see `ports:` below), so a
# data-service on another VPS connects via REDIS_URL=redis://<this-host>:6379/0.
#
# Run with its own project name so it's independent of the `data` stack:
#   docker compose -p data-service-redis -f docker-compose.redis.yaml up
# Requires the shared network once:  docker network create data_service_network

services:
  redis:
    container_name: data-service-redis-dev
    image: redis:8.10-trixie
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD} --maxmemory 7gb --maxmemory-policy volatile-ttl --save 300 1 --appendonly no
    environment:
      # Lets the healthcheck's redis-cli authenticate.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    restart: unless-stopped
    # Published on every host interface, so the cache is reachable from the
    # data services on another VPS. Docker-published ports bypass ufw: the
    # password is what guards it, plus the Hetzner Cloud Firewall on the
    # public interface.
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # redis-cli exits 0 on a NOAUTH reply too, so match the PONG itself.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
      start_interval: 1s
    networks:
      - data_service_network

volumes:
  redis_data:

networks:
  data_service_network:
    external: true
