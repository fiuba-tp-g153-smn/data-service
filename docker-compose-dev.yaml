# Data Service - Tile Serving via REST API
#
# This service syncs tiles from an external S3 bucket and serves them via REST API.
# The S3 instance is typically provided by tiles-processor running separately.
#
# Configuration:
#   S3_TILES_DATA_ENDPOINT: Set to the S3 host:port (e.g., "host.docker.internal:9000" for local,
#                   or "s3.example.com:9000" for remote)
#
# Usage with tiles-processor S3:
#   1. Start tiles-processor: cd ../tiles-processor && docker compose up -d
#   2. Set S3_TILES_DATA_ENDPOINT=host.docker.internal:9000 in .env
#   3. Start data-service: docker compose up -d

services:
  redis:
    container_name: data-service-redis-dev
    image: redis:8.6-alpine
    command: redis-server --maxmemory 5gb --maxmemory-policy allkeys-lru --save 300 1 --appendonly no
    restart: unless-stopped
    ports:
      - "6389:6379"
    expose:
      - 6389
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
      start_interval: 1s

  data-service:
    container_name: data-service-dev-container
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - APP_HOST_PORT=${APP_HOST_PORT}
    ports:
      - "${APP_HOST_PORT:-6006}:8080"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allows connecting to host services (Linux)
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app
      - ./settings.json:/settings.json:ro
      # ./src is mounted at /app, so db/migrate.py resolves the repo root to "/";
      # the metrics-DB migrations must be reachable at /alembic.ini + /migrations.
      - ./alembic.ini:/alembic.ini:ro
      - ./migrations:/migrations:ro
      - ./output_radar:/output_radar
      - ./data:/app/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - APP_ENV=${APP_ENV}
      # S3 Configuration - connect to external S3 (e.g., S3 from tiles-processor)
      # Use host.docker.internal:9000 to connect to S3 running on the host
      - S3_TILES_DATA_ENDPOINT=${S3_TILES_DATA_ENDPOINT}
      - S3_TILES_DATA_ACCESS_KEY=${S3_TILES_DATA_ACCESS_KEY}
      - S3_TILES_DATA_SECRET_KEY=${S3_TILES_DATA_SECRET_KEY}
      - S3_TILES_DATA_BUCKET_NAME=${S3_TILES_DATA_BUCKET_NAME}
      - S3_TILES_DATA_SECURE=${S3_TILES_DATA_SECURE}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY}
      - REDIS_URL=${REDIS_URL}
      # Basemap tile backup bucket + per-provider source URLs
      - S3_BASEMAP_BUCKET_NAME=${S3_BASEMAP_BUCKET_NAME}
      - BASEMAP_ARGENMAP_URL=${BASEMAP_ARGENMAP_URL}
      - BASEMAP_ARGENMAPGRIS_URL=${BASEMAP_ARGENMAPGRIS_URL}
      - BASEMAP_ARGENMAPOSCURO_URL=${BASEMAP_ARGENMAPOSCURO_URL}
      - BASEMAP_ARGENMAPTOPOGRAFICO_URL=${BASEMAP_ARGENMAPTOPOGRAFICO_URL}
      - BASEMAP_SATELLITE_URL=${BASEMAP_SATELLITE_URL}
      - BASEMAP_TOPOGRAPHIC_URL=${BASEMAP_TOPOGRAPHIC_URL}
      - BASEMAP_GOOGLESATELLITE_URL=${BASEMAP_GOOGLESATELLITE_URL}
      - BASEMAP_OCEANBASE_URL=${BASEMAP_OCEANBASE_URL}
      # Weather stations: dedicated S3 bucket + SMN API credentials + admin password
      - S3_WEATHER_STATIONS_BUCKET_NAME=${S3_WEATHER_STATIONS_BUCKET_NAME}
      - SMN_API_BASE_URL=${SMN_API_BASE_URL}
      - SMN_API_USERNAME=${SMN_API_USERNAME}
      - SMN_API_PASSWORD=${SMN_API_PASSWORD}
      - SMN_API_TOKEN_SETTLING_DELAY_SECONDS=${SMN_API_TOKEN_SETTLING_DELAY_SECONDS}
      - SMN_API_USER_AGENT=${SMN_API_USER_AGENT}
      - SMN_API_LOG_REQUESTS=${SMN_API_LOG_REQUESTS}
      - SMN_STATIONS_REGISTRY_URL=${SMN_STATIONS_REGISTRY_URL}
      - WEATHER_STATIONS_ADMIN_PASSWORD=${WEATHER_STATIONS_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
      start_interval: 1s

volumes:
  redis_dev_data:
